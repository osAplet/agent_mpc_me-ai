name: MCP Audit

on:
  workflow_dispatch:             # 🖐 Ruční spuštění přes GitHub
  push:
    branches:
      - master-aplet             # 🌿 Spouštět pouze na této větvi
  schedule:
    - cron: '0 8 * * *'          # ⏰ Každý den v 08:00 (CEST)

jobs:
  audit:
    runs-on: ubuntu-latest       # 🐧 GitHub CI prostředí

    env:
      GH_PAT: ${{ secrets.GH_PAT }}  # 🔐 Token z Secrets

    steps:
      - name: 🧾 Checkout repozitáře
        uses: actions/checkout@v3

      - name: 🐍 Nastavení Pythonu
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Instalace knihovny requests
        run: pip install requests

      - name: 🔧 Volitelná instalace ssh-keygen
        run: sudo apt update && sudo apt install openssh-client -y

      - name: 🕯️ Spuštění auditního agenta
        run: python mcp_agent.py
